# mEEme scheduled jobs — for serverless hosts only.
#
# OPT-IN. This workflow does nothing until both secrets below are set, and skips
# quietly when they are not. That matters: the primary deployment runs on a
# persistent host with ENABLE_INTERNAL_CRON=true and schedules its own jobs
# in-process, so this workflow is unused there. Without the skip it would post a
# failed run every five minutes forever, and a permanently red Actions tab is a
# broken alarm — you stop reading it, including on the day it means something.
#
# Do NOT enable this against a deployment that already has ENABLE_INTERNAL_CRON
# set. Both together would double every alert.
#
# To use it (Vercel, or any serverless host), set both repository secrets under
# Settings → Secrets and variables → Actions:
#   MEEME_APP_URL     https://your-deployment.example.com   (no trailing slash)
#   MEEME_CRON_SECRET the same value as CRON_SECRET on the host
name: mEEme cron

on:
  schedule:
    # GitHub's scheduler is best-effort and can lag under load; these are
    # "at least this often", not "exactly on the minute".
    - cron: '*/5 * * * *'    # sweep: positions, watches, alert delivery
    - cron: '17 * * * *'     # score: grade calls past their 4h horizon
    - cron: '*/30 * * * *'   # scan: autonomous market read
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: sweep
        type: choice
        options: [sweep, score, scan]

concurrency:
  # Never let a slow run overlap the next tick.
  group: meeme-cron-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pick endpoint
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '*/5 * * * *')  echo "path=sweep" >> "$GITHUB_OUTPUT" ;;
            '17 * * * *')   echo "path=score" >> "$GITHUB_OUTPUT" ;;
            '*/30 * * * *') echo "path=scan"  >> "$GITHUB_OUTPUT" ;;
            *)              echo "path=${{ inputs.job || 'sweep' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Call ${{ steps.pick.outputs.path }}
        env:
          APP_URL: ${{ secrets.MEEME_APP_URL }}
          CRON_SECRET: ${{ secrets.MEEME_CRON_SECRET }}
          JOB: ${{ steps.pick.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice::Not configured — MEEME_APP_URL and MEEME_CRON_SECRET are unset."
            echo "::notice::This is expected when the deployment schedules its own jobs (ENABLE_INTERNAL_CRON=true)."
            exit 0
          fi

          # --fail-with-body so a non-2xx surfaces the reason instead of an
          # empty red X, and a bounded retry so one cold start is not an outage.
          curl --silent --show-error --fail-with-body \
               --retry 2 --retry-delay 5 --max-time 120 \
               -H "authorization: Bearer ${CRON_SECRET}" \
               "${APP_URL}/api/cron/${JOB}"
